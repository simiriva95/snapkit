name: Release

# Tag vX.Y.Z (matching package.json version) → build signed installers on all
# three OSes and publish them to a GitHub Release (electron-updater feed).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Some environments skip electron's postinstall binary download.
      - run: node node_modules/electron/install.js

      - run: npm test
      - run: npm run typecheck

      - name: Build and publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Production license public key (PEM). Falls back to the committed
          # DEV key when unset — do NOT ship a paid release without this.
          SNAPKIT_LICENSE_PUBKEY: ${{ secrets.SNAPKIT_LICENSE_PUBKEY }}
          # Unsigned builds for now. IMPORTANT: electron-builder treats a
          # DEFINED-but-empty CSC_LINK as a file path and crashes — when the
          # certs exist, ADD the env lines back (CSC_LINK, CSC_KEY_PASSWORD,
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, AZURE_*)
          # and drop the line below. See docs/selling.md.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The app is ad-hoc signed, not notarized: quarantined downloads are
      # blocked by Gatekeeper ("Snapkit is damaged"). Until we notarize
      # (docs/selling.md), every release body carries the workaround.
      - name: Append macOS install note to release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/mac-note.md <<'EOF'

          ---
          ### macOS install note
          The app is not notarized yet, so macOS reports it as **“damaged”**. After copying Snapkit to Applications, run:
          ```
          xattr -cr /Applications/Snapkit.app
          ```
          then open it normally. (Right-click → Open does not bypass this on macOS 15+.)
          EOF
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --json body -q .body > /tmp/body.md || exit 0
          if ! grep -q 'xattr -cr' /tmp/body.md; then
            cat /tmp/body.md /tmp/mac-note.md > /tmp/new-body.md
            gh release edit "$TAG" --notes-file /tmp/new-body.md
          fi
