name: Release

# Tag vX.Y.Z (matching package.json version) → build signed installers on all
# three OSes and publish them to a GitHub Release (electron-updater feed).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      # Serial on purpose: in parallel every OS finds "release doesn't exist"
      # and creates its own draft, so v0.4.2 ended up as two drafts with the
      # assets split between them. The first job creates it, the rest attach.
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Some environments skip electron's postinstall binary download.
      - run: node node_modules/electron/install.js

      - run: npm test
      - run: npm run typecheck

      - name: Build and publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Production license public key (PEM). Falls back to the committed
          # DEV key when unset — do NOT ship a paid release without this.
          SNAPKIT_LICENSE_PUBKEY: ${{ secrets.SNAPKIT_LICENSE_PUBKEY }}
          # Unsigned builds for now. IMPORTANT: electron-builder treats a
          # DEFINED-but-empty CSC_LINK as a file path and crashes — when the
          # certs exist, ADD the env lines back (CSC_LINK, CSC_KEY_PASSWORD,
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, AZURE_*)
          # and drop the line below. See docs/selling.md.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The app is ad-hoc signed, not notarized: browser downloads are
      # quarantined and Gatekeeper rejects them ("Snapkit is damaged"). Until
      # we notarize (docs/selling.md), steer macOS users to the install
      # script / brew instead of the .dmg. See README "Install".
      - name: Append macOS install guide to release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/mac-note.md <<'EOF'

          ---
          ### 🍎 macOS — don't download the .dmg, use one of these
          The app is not notarized yet, so anything downloaded with a browser is blocked by Gatekeeper ("Snapkit is damaged"). Install from the terminal instead:

          ```
          curl -fsSL https://raw.githubusercontent.com/simiriva95/snapkit/main/scripts/install.sh | bash
          ```

          or with Homebrew:

          ```
          brew tap simiriva95/snapkit https://github.com/simiriva95/snapkit
          brew install --cask --no-quarantine snapkit
          ```

          Already downloaded the .dmg? Copy the app to Applications, then `xattr -cr /Applications/Snapkit.app`.
          EOF
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --json body -q .body > /tmp/body.md || exit 0
          if ! grep -q 'install.sh' /tmp/body.md; then
            cat /tmp/body.md /tmp/mac-note.md > /tmp/new-body.md
            gh release edit "$TAG" --notes-file /tmp/new-body.md
          fi

      # Keep the Homebrew cask (Casks/snapkit.rb, served from this repo as a
      # tap) pointing at the release that was just published.
      - name: Bump Homebrew cask
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "dist/Snapkit-${VERSION}-arm64-mac.zip" | cut -d' ' -f1)
          sed -i '' \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
            Casks/snapkit.rb
          FILE_SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/Casks/snapkit.rb?ref=main" -q .sha)
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/contents/Casks/snapkit.rb" \
            -f message="chore(brew): bump cask to ${VERSION}" \
            -f content="$(base64 -i Casks/snapkit.rb)" \
            -f sha="$FILE_SHA" \
            -f branch=main
