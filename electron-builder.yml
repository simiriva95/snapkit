appId: dev.snapkit.app
productName: Snapkit
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json

# Signing is env-driven (see docs/selling.md): local `npm run package` skips
# it via CSC_IDENTITY_AUTO_DISCOVERY=false; CI signs when secrets are present
# (CSC_LINK/CSC_KEY_PASSWORD; notarization via APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID).
mac:
  category: public.app-category.developer-tools
  # Ad-hoc signature ('-'): required so Apple Silicon accepts the app. Skipping
  # signing entirely leaves Electron's stale signature → "app is damaged".
  # hardenedRuntime is only needed for notarization (which we don't do yet) and
  # would risk library-validation launch failures under an ad-hoc signature.
  # Before selling: Developer ID + hardenedRuntime:true + notarize (docs/selling.md).
  identity: '-'
  hardenedRuntime: false
  target:
    - dmg
    - zip

win:
  target:
    - target: nsis
      arch: [x64] # the overwhelming majority of Windows machines

nsis:
  oneClick: true
  deleteAppDataOnUninstall: false

linux:
  category: Utility
  target:
    - AppImage
    - deb

# Auto-update feed (electron-updater): GitHub Releases.
# CHANGE owner/repo to the real GitHub repository before the first release.
publish:
  provider: github
  owner: simiriva95
  repo: snapkit
npmRebuild: false
