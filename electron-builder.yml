appId: dev.snapkit.app
productName: Snapkit
directories:
  output: dist
files:
  - out/**
  - resources/**
  - '!resources/ffmpeg/**'
  - package.json

# Bundled ffmpeg (video post-processing). Only the host platform's binary is
# present (scripts/setup-ffmpeg.mjs) and only it ships: ${os}/${arch} are
# electron-builder macros → mac-arm64, win-x64, linux-x64.
# Read from process.resourcesPath + '/ffmpeg' (see src/main/ffmpeg.ts).
extraResources:
  - from: resources/ffmpeg/${os}-${arch}/
    to: ffmpeg/
    filter: ['**/*', '!.sha256']

# A missing extraResources source is only a WARNING in electron-builder, so
# cross-platform packaging would silently ship an installer without ffmpeg.
# This hook turns that into a hard failure.
beforePack: scripts/before-pack.mjs

# Signing is env-driven (see docs/selling.md): local `npm run package` skips
# it via CSC_IDENTITY_AUTO_DISCOVERY=false; CI signs when secrets are present
# (CSC_LINK/CSC_KEY_PASSWORD; notarization via APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID).
mac:
  category: public.app-category.developer-tools
  # Ad-hoc signature ('-'): required so Apple Silicon accepts the app. Skipping
  # signing entirely leaves Electron's stale signature → "app is damaged".
  # hardenedRuntime is only needed for notarization (which we don't do yet) and
  # would risk library-validation launch failures under an ad-hoc signature.
  # Before selling: Developer ID + hardenedRuntime:true + notarize (docs/selling.md).
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Snapkit records your microphone only when you enable it for screen recordings.
  target:
    - dmg
    - zip

win:
  target:
    - target: nsis
      arch: [x64] # the overwhelming majority of Windows machines

nsis:
  oneClick: true
  deleteAppDataOnUninstall: false

linux:
  category: Utility
  target:
    - AppImage
    - deb

# Auto-update feed (electron-updater): GitHub Releases.
# CHANGE owner/repo to the real GitHub repository before the first release.
publish:
  provider: github
  owner: simiriva95
  repo: snapkit
npmRebuild: false
